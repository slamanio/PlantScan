<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/static/css/garden.css?v=2025-08-14-1">

<link rel="shortcut icon" href="/static/assets/imgs/chip.png">
<title>PlantScan - Jardim </title>
</head>
<body class="{{ theme }}">

<button id="theme-toggle">🌙</button>



<div class="star" style="top:20px;left:30%;animation-delay:1s"></div>
<div class="star" style="top:60px;left:50%;animation-delay:2s"></div>
<div class="star" style="top:100px;left:70%;animation-delay:3s"></div>
<div class="star" style="top:150px;left:20%;animation-delay:1.5s"></div>
<div class="star" style="top:180px;left:80%;animation-delay:2.5s"></div>

<!-- ☀️ Sol -->
<div class="sun sunrise"></div>

<!-- 🌙 Lua -->
<div class="moon moonset"></div>

<!-- ☁️ Nuvens -->
<div class="cloud"></div>
<div class="cloud"></div>
<div class="cloud"></div>

<!-- 🌸 Flores -->
<div class="flower"></div>
<div class="flower"></div>
<div class="flower"></div>
<div class="flower"></div>
<div class="flower"></div>
<div class="flower"></div>

<!-- 🦋 Borboletas -->
<div class="butterfly">🦋</div>
<div class="butterfly">🦋</div>

<!-- 🌱 Grama -->
<div class="grass"></div>

<!-- 🌼 Título -->
<div class="title">🌸 Jardim Virtual de {{user_name}}!</div>
<div class="container">
    <p>Bem-vindo ao seu espaço tranquilo! 🌙🦋</p>
    <ul class="plant-list">
  {% for tp in plants %}
    <li class="plant-item" onclick="handlePlantClick('{{ tp.id }}')">
      <span class="plant-icon">🌿</span>
      <strong>{{ tp.name }}</strong>
    </li>
  {% endfor %}
</ul>

  </div>
  <div id="plant-modal" class="plant-modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-plant-name">

  <!-- Barra vertical de saúde (classe muda conforme condição) -->
  <div id="health-bar" class="health-bar"></div>

  <div class="modal-content" id="modal-content">



  <button class="close-modal" onclick="closeModal()" aria-label="Fechar modal">×</button>

  <input type="file" id="plant-image-input" accept="image/*" style="display:none" />

<!-- Botão visível -->
<button class="update-btn" id="update-btn">
  Atualizar
</button>



<h2 id="modal-plant-name">Nome da Planta</h2>


  <div id="modal-plant-pic" class="modal-plant-pic">
    <img id="plant-image" src="" alt="Imagem da planta" style="width:100%; border-radius:8px;">
    <div id="plant-description" style="margin-top:10px;"></div>
    <div id="plant-color-bar" style="height:5px; margin-top:5px;"></div>

    
  </div>


<p id="modal-health-condition">Descrição da condição da planta aqui...</p>


  
</div>


</div>




 <button class="back-btn" onclick="window.location.href='{{ url_for('home') }}'">
  <i class="fas fa-arrow-left"></i> Voltar
</button>

<script>
  
const btn = document.getElementById("theme-toggle");
const sun = document.querySelector(".sun");
const moon = document.querySelector(".moon");
const updateBtn = document.getElementById('update-btn');
const fileInput = document.getElementById('plant-image-input');
const dropdown = document.getElementById('dropdown')
let imagemAnterior = null;
let plantid = null;



 function getPlantId(id) {
    plantid = id;
  }
  // Ao clicar no botão, abre o seletor de arquivo
  updateBtn.addEventListener('click', () => {
    fileInput.click();
  });

  // Quando o usuário escolher arquivo, chama atualizarPlanta()
  fileInput.addEventListener('change', () => {
    if (fileInput.files.length > 0) {
      atualizarPlanta(fileInput.files[0]);
    }
  });

document.getElementById("plant-modal").addEventListener("click", function(event) {
  const modalContent = document.querySelector(".modal-content");
  if (!modalContent.contains(event.target)) {
    closeModal();
  }
});

async function atualizarPlanta(novaImagemFile) {
  console.log("[handlePlantClick] Iniciando atualização para planta ID:", plantid);
  const imgElement = document.getElementById("plant-image");
  try {
    const formData = new FormData();
    formData.append('nova_imagem', novaImagemFile);
    formData.append("imagem_anterior", imgElement.src);
    formData.append('plant_id', plantid)

    const response = await fetch(`${window.location.origin}/update_plant_image`, {
      method: 'POST',
      body: formData
    });
    console.log(response)
    if (!response.ok) {
      throw new Error('Erro ao atualizar planta');
    }

    const data = await response.json();
    console.log("Resposta do servidor:", data);
    const payload = data?.dados || data || {};
        const cor = payload.color;
        const condition = payload.condition;
        const solution = payload.solution;
        const isPlanta = payload.isplant;
        const sameplant = payload.sameplant;
    if (isPlanta == false){
      console.log("A imagem fornecida não é uma planta.")

    }
    if (sameplant == false){
      console.log("A imagem fornecida não é a mesma planta!")

    }
    else{
      registrarstatusdaplanta(condition, cor, solution, novaImagemFile)
    }


  } catch (err) {
    console.error('Erro:', err);
  }
}


async function registrarstatusdaplanta(condicao, cor, solucao, file){
 console.log("[handlePlantClick] Iniciando atualização para planta ID:", plantid);
  try {
    const formData = new FormData();
    formData.append('condition', condicao);
    formData.append("plant_id", plantid);
    formData.append("image_url", file);
    formData.append("solution", solucao);
    formData.append("color", cor);

    const response = await fetch(`${window.location.origin}/register_new_plant_image`, {
      method: 'POST',
      body: formData
    });

    if (!response.ok) {
      throw new Error('Erro ao registrar planta');
    }

    const data = await response.json();
    console.log("Resposta do servidor:", data);


  } catch (err) {
    console.error('Erro:', err);
  }
}

function handlePlantClick(plantId) {
  console.log("[handlePlantClick] Iniciando busca para planta ID:", plantId);
  getPlantId(plantId);
  const formData = new FormData();
  formData.append("plant_id", plantId);

  fetch("/userplant-info", {
    method: "POST",
    body: formData
  })
  .then(response => {
    if (!response.ok) throw new Error("Erro ao buscar planta");
    return response.json();
  })
  .then(data => {
    console.log(data)
    const payload = data?.dados || data || {};
        const cor = payload.cor;
        const condition = payload.descricao;
        const especie = payload.especie;
        const image= payload.imagens;
        const variety = (payload.imagevariety || []).map(v => v.path);
        const descvariety = (payload.imagevariety || []).map(c => c.descricao);
        const solvariety = (payload.imagevariety || []).map(d => d.solution);
        const colorvariety = (payload.imagevariety || []).map(r => r.color);
        
        setHealthConditionText(condition, especie, image, cor, variety, descvariety, solvariety, colorvariety);
        

        }       


  )
  .catch(err => {
    console.error("[handlePlantClick] Erro:", err);
  });
} //fim da funcao

function hideUpdateButton() {
    if (updateBtn) {
        updateBtn.style.display = "none";
    }
}

function hideDropdown() {
    if (dropdown) {
        dropdown.style.display = "none";
    }
}
function closeModal() {
  document.getElementById("plant-modal").classList.add("hidden");
   document.getElementById("plant-image").src = "";
    document.getElementById("plant-description").textContent = "";
    document.getElementById("plant-color-bar").style.backgroundColor = "";
    document.getElementById("modal-plant-name").textContent = "";
    document.getElementById("modal-health-condition").textContent = "";

    // Limpar opções do dropdown
    const options = document.getElementById("Dropdown");
    options.innerHTML = "";
}

window.addEventListener('DOMContentLoaded', () => {
  const isNight = document.body.classList.contains('dark');
  const sun = document.querySelector('.sun');
  const moon = document.querySelector('.moon');
  const btn = document.getElementById('theme-toggle');

  if (isNight) {
    sun.classList.remove('sunrise');
    sun.classList.add('sunset');
    moon.classList.remove('moonset');
    moon.classList.add('moonrise');
    btn.textContent = '🌞';
  } else {
    sun.classList.remove('sunset');
    sun.classList.add('sunrise');
    moon.classList.remove('moonrise');
    moon.classList.add('moonset');
    btn.textContent = '🌙';
  }
});


btn.addEventListener("click", () => {
    const isNight = document.body.classList.toggle("dark");

    // 🌞/🌙 Alterna ícone do botão
    btn.textContent = isNight ? "🌞" : "🌙";

    // 🌌 Animações do sol e da lua
    if (isNight) {
        sun.classList.remove("sunrise");
        sun.classList.add("sunset");
        moon.classList.remove("moonset");
        moon.classList.add("moonrise");
    } else {
        sun.classList.remove("sunset");
        sun.classList.add("sunrise");
        moon.classList.remove("moonrise");
        moon.classList.add("moonset");
    }

    // Envia para backend
    fetch("/update_theme", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ theme: isNight ? "dark" : "light" })
    });
});

function setHealthConditionText(condition, especie, image, cor, variety, descvariety, solvariety, colorvariety) {
    // Garantir que sejam arrays
    variety = Array.isArray(variety) ? variety : [];
    descvariety = Array.isArray(descvariety) ? descvariety : [];
    solvariety = Array.isArray(solvariety) ? solvariety : [];
    colorvariety = Array.isArray(colorvariety) ? colorvariety : [];
    console.log(variety)
    let currentIndex = 0;
 

    // Função para atualizar a imagem e descrição com base no índice atual

        const imgElement = document.getElementById("plant-image");
        const descElement = document.getElementById("modal-health-condition");
        const plantpic = document.getElementById("modal-plant-pic");
        const colorBar = document.getElementById("plant-color-bar");
        const options = document.getElementById("modal-content");
        console.log(options)
        if(variety[0] == false){

          plantpic.classList.add(cor)
          imgElement.src = image;
          descElement.textContent = condition || "Sem descrição";
        
        }else{
        const dropdown = document.createElement("select")
        dropdown.classList.add("plant-dropdown")
        dropdown.id = "dropdown";
        options.appendChild(dropdown)
        const firstOp = document.createElement("option")
        let firstindex = 0
        plantpic.classList.add(cor)
        console.log(plantpic)
        firstOp.value = `${especie} #${firstindex}`
        firstOp.textContent = `${especie} #${firstindex}`
        firstOp.classList.add("plant-dropdown-option")
        imgElement.src = image;
        descElement.textContent = condition || "Sem descrição";
        dropdown.appendChild(firstOp);

        variety.forEach((op, index) => {
        const dot = document.createElement("option");
        dot.value = `${especie} ${index + 1}`;
        dot.textContent = `${especie} #${index + 1}`;
        
        dot.classList.add("plant-dropdown-option");
        dot.id = "option";
        dropdown.appendChild(dot);
         
    })};


    options.addEventListener("change", function() {
    // Pega o índice da opção selecionada
    const dot = document.getElementById("option")
    const selectedIndex = dot.selectedIndex;
    console.log(selectedIndex)
     plantpic.classList.remove(cor);
    plantpic.classList.remove(...colorvariety);
    // Atualiza os elementos
    const imgElement = document.getElementById("plant-image");
    const descElement = document.getElementById("plant-description");
    const colorBar = document.getElementById("plant-color-bar");

    if (selectedIndex === 0) {
      console.log(selectedIndex)
      plantpic.classList.remove(cor)
      hideUpdateButton()
        // Quando for a primeira opção
        imgElement.src = image; // imagem padrão
        document.getElementById("modal-health-condition").textContent = condition;
        
        plantpic.classList.add(cor)
        console.log(plantpic)
    } else {
      console.log(selectedIndex)

        // Para as demais opções
        imgElement.src = `uploads/${variety[selectedIndex - 1]}`;
        document.getElementById("modal-health-condition").textContent = descvariety[selectedIndex - 1] || "";
        plantpic.classList.add(colorvariety[selectedIndex - 1]);
        console.log(plantpic)
    }
});
    

    
    // Nome e espécie
    document.getElementById("modal-plant-name").textContent = especie || "Nome desconhecido";


    // Exibe o modal
    const modal = document.getElementById("plant-modal");
    if (modal) modal.classList.remove("hidden");
  
}


    
    


</script>

</body>
</html>
