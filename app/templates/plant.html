<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/static/css/garden.css">
<link rel="shortcut icon" href="/static/assets/imgs/chip.png">
<title>PlantScan - Jardim </title>
</head>
<body class="{{ theme }}">

<button id="theme-toggle">🌙</button>



<div class="star" style="top:20px;left:30%;animation-delay:1s"></div>
<div class="star" style="top:60px;left:50%;animation-delay:2s"></div>
<div class="star" style="top:100px;left:70%;animation-delay:3s"></div>
<div class="star" style="top:150px;left:20%;animation-delay:1.5s"></div>
<div class="star" style="top:180px;left:80%;animation-delay:2.5s"></div>

<!-- ☀️ Sol -->
<div class="sun sunrise"></div>

<!-- 🌙 Lua -->
<div class="moon moonset"></div>

<!-- ☁️ Nuvens -->
<div class="cloud"></div>
<div class="cloud"></div>
<div class="cloud"></div>

<!-- 🌸 Flores -->
<div class="flower"></div>
<div class="flower"></div>
<div class="flower"></div>
<div class="flower"></div>
<div class="flower"></div>
<div class="flower"></div>

<!-- 🦋 Borboletas -->
<div class="butterfly">🦋</div>
<div class="butterfly">🦋</div>

<!-- 🌱 Grama -->
<div class="grass"></div>

<!-- 🌼 Título -->
<div class="title">🌸 Jardim Virtual de {{user_name}}!</div>
<div class="container">
    <p>Bem-vindo ao seu espaço tranquilo! 🌙🦋</p>
    <ul class="plant-list">
  {% for tp in plants %}
    <li class="plant-item" onclick="handlePlantClick('{{ tp.id }}')">
      <span class="plant-icon">🌿</span>
      <strong>{{ tp.name }}</strong>
    </li>
  {% endfor %}
</ul>

  </div>
  <div id="plant-modal" class="plant-modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-plant-name">

  <!-- Barra vertical de saúde (classe muda conforme condição) -->
  <div id="health-bar" class="health-bar"></div>

  <div class="modal-content">
  <button class="close-modal" onclick="closeModal()" aria-label="Fechar modal">×</button>

  <input type="file" id="plant-image-input" accept="image/*" style="display:none" />

<!-- Botão visível -->
<button class="update-btn" id="update-btn">
  Atualizar
</button>


  <h2 id="modal-plant-name">Nome da Planta</h2>

  <div id="modal-plant-pic" class="Green">
    <div id="plant-carousel">
    <img id="plant-image" src="" alt="Imagem da planta" style="width:300px; border-radius:8px;">
    <div id="plant-description" style="margin-top:10px;"></div>
    <div id="plant-color-bar" style="height:5px; margin-top:5px;"></div>

    <div style="margin-top:10px;">
        <button onclick="prevImage()">⬅ Anterior</button>
        <button onclick="nextImage()">Próxima ➡</button>
    </div>
</div>

  </div>

  <p id="modal-health-condition">Descrição da condição da planta aqui...</p>

  <div class="chat-box">
    <div id="chat-messages">
      <!-- Mensagens vão aparecer aqui -->
    </div>
    <div class="chat-input">
      <input type="text" id="chat-message-input" placeholder="Digite sua mensagem...">
      <button onclick="sendChatMessage()">Enviar</button>
    </div>
  </div>
</div>


</div>




 <button class="back-btn" onclick="window.location.href='{{ url_for('home') }}'">
  <i class="fas fa-arrow-left"></i> Voltar
</button>

<script>
  
const btn = document.getElementById("theme-toggle");
const sun = document.querySelector(".sun");
const moon = document.querySelector(".moon");
const updateBtn = document.getElementById('update-btn');
const fileInput = document.getElementById('plant-image-input');
let imagemAnterior = null;
let plantid = null;
let plantImages = [];  // Recebe do backend [{url, description, color}, ...]
let currentIndex = 0;

function loadCarousel(images) {
    plantImages = images;
    currentIndex = 0;
    updateCarousel();
}

function updateCarousel() {
    const img = plantImages[currentIndex];
    if (!img) return;

    document.getElementById("plant-image").src = img.url;
    document.getElementById("plant-description").innerText = img.description || "Sem descrição";
    document.getElementById("plant-color-bar").style.backgroundColor = img.color || "transparent";
}

function nextImage() {
    if (plantImages.length === 0) return;
    currentIndex = (currentIndex + 1) % plantImages.length;
    updateCarousel();
}

function prevImage() {
    if (plantImages.length === 0) return;
    currentIndex = (currentIndex - 1 + plantImages.length) % plantImages.length;
    updateCarousel();
}

 function getPlantId(id) {
    plantid = id;
  }
  // Ao clicar no botão, abre o seletor de arquivo
  updateBtn.addEventListener('click', () => {
    fileInput.click();
  });

  // Quando o usuário escolher arquivo, chama atualizarPlanta()
  fileInput.addEventListener('change', () => {
    if (fileInput.files.length > 0) {
      atualizarPlanta(fileInput.files[0]);
    }
  });

document.getElementById("plant-modal").addEventListener("click", function(event) {
  const modalContent = document.querySelector(".modal-content");
  if (!modalContent.contains(event.target)) {
    closeModal();
  }
});

async function atualizarPlanta(novaImagemFile) {
  console.log("[handlePlantClick] Iniciando atualização para planta ID:", plantid);
  try {
    const formData = new FormData();
    formData.append('nova_imagem', novaImagemFile);
    formData.append("plant_id", plantid);

    const response = await fetch(`${window.location.origin}/update_plant_image`, {
      method: 'POST',
      body: formData
    });

    if (!response.ok) {
      throw new Error('Erro ao atualizar planta');
    }

    const data = await response.json();
    console.log("Resposta do servidor:", data);
    if (data.isplant == false){
      console.log("A imagem fornecida não é uma planta.")
      console.log(data.isplant)
    }
    else{
      registrarstatusdaplanta(data)
    }

    // 1️⃣ Atualiza a descrição da planta no modal
      

  } catch (err) {
    console.error('Erro:', err);
  }
}


async function registrarstatusdaplanta(data){
 console.log("[handlePlantClick] Iniciando atualização para planta ID:", plantid);
  try {
    const formData = new FormData();
    formData.append('condition', data.condition);
    formData.append("plant_id", plantid);
    formData.append("image_url", novaImagemFile);
    formData.append("solution", data.solution);
    formData.append("color", data.color);

    const response = await fetch(`${window.location.origin}/register_new_plant_image`, {
      method: 'POST',
      body: formData
    });

    if (!response.ok) {
      throw new Error('Erro ao registrar planta');
    }

    const data = await response.json();
    console.log("Resposta do servidor:", data);


  } catch (err) {
    console.error('Erro:', err);
  }
}

function handlePlantClick(plantId) {
  console.log("[handlePlantClick] Iniciando busca para planta ID:", plantId);
  getPlantId(plantId);
  const formData = new FormData();
  formData.append("plant_id", plantId);

  fetch("/userplant-info", {
    method: "POST",
    body: formData
  })
  .then(response => {
    if (!response.ok) throw new Error("Erro ao buscar planta");
    return response.json();
  })
  .then(data => {
    // Atualiza nome e família no modal
    const nomeElem = document.getElementById("modal-plant-name");
    if (nomeElem) nomeElem.textContent = data.especie || "Desconhecida";
    
    // Atualiza imagens
    const container = document.getElementById("modal-plant-pic");
    container.className = "modal-plant-pic " + (data.imagens[0].cor);
    if (!container) {
      console.warn("[handlePlantClick] modal-plant-pic não encontrado");
      return;
    }
    container.innerHTML = "";
    

    if (data.imagens && data.imagens.length > 0) {
      
  // Atualize a descrição geral (se quiser) com a primeira imagem ou alguma info geral
  const geralDesc = document.getElementById("modal-health-condition");
if (geralDesc) {
  const texto = `Condição: ${data.imagens[0].cor || "Cor desconhecida"} - ${data.imagens[0].descricao || "Sem descrição"}`;
  setHealthConditionText(texto);
}



  data.imagens.forEach(img => {
    const wrapper = document.createElement("div");
    wrapper.classList.add("plant-image-item");

    const imgElem = document.createElement("img");
    imgElem.src = img.path;
    
    imgElem.alt = img.descricao || "Imagem da planta";

    // Cria descrição individual para cada imagem

    wrapper.appendChild(imgElem);


    container.appendChild(wrapper);
  });
} else {
  container.innerHTML = "<p>Nenhuma imagem disponível.</p>";
}


    // Exibe o modal
    const modal = document.getElementById("plant-modal");
    if (modal) modal.classList.remove("hidden");
  })
  .catch(err => {
    console.error("[handlePlantClick] Erro:", err);
  });
}



function closeModal() {
  document.getElementById("plant-modal").classList.add("hidden");
}

window.addEventListener('DOMContentLoaded', () => {
  const isNight = document.body.classList.contains('dark');
  const sun = document.querySelector('.sun');
  const moon = document.querySelector('.moon');
  const btn = document.getElementById('theme-toggle');

  if (isNight) {
    sun.classList.remove('sunrise');
    sun.classList.add('sunset');
    moon.classList.remove('moonset');
    moon.classList.add('moonrise');
    btn.textContent = '🌞';
  } else {
    sun.classList.remove('sunset');
    sun.classList.add('sunrise');
    moon.classList.remove('moonrise');
    moon.classList.add('moonset');
    btn.textContent = '🌙';
  }
});


btn.addEventListener("click", () => {
    const isNight = document.body.classList.toggle("dark");

    // 🌞/🌙 Alterna ícone do botão
    btn.textContent = isNight ? "🌞" : "🌙";

    // 🌌 Animações do sol e da lua
    if (isNight) {
        sun.classList.remove("sunrise");
        sun.classList.add("sunset");
        moon.classList.remove("moonset");
        moon.classList.add("moonrise");
    } else {
        sun.classList.remove("sunset");
        sun.classList.add("sunrise");
        moon.classList.remove("moonrise");
        moon.classList.add("moonset");
    }

    // Envia para backend
    fetch("/update_theme", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ theme: isNight ? "dark" : "light" })
    });
});
function sendChatMessage() {
  const input = document.getElementById("chat-message-input");
  const message = input.value.trim();
  if (!message) return;

  // Adiciona mensagem do usuário
  addMessage(message, "user");

  // Limpa input
  input.value = "";

  // Simula resposta automática
  setTimeout(() => {
    addMessage("Entendido! Vou verificar sobre essa planta.", "bot");
  }, 800);
}

function addMessage(text, sender) {
  const messagesContainer = document.getElementById("chat-messages");
  const msg = document.createElement("div");
  msg.classList.add("chat-message", sender);
  msg.textContent = text;
  messagesContainer.appendChild(msg);
  messagesContainer.scrollTop = messagesContainer.scrollHeight;
}
function setHealthConditionText(fullText) {
  const container = document.getElementById("modal-health-condition");
  const maxLength = 300;

  if (fullText.length <= maxLength) {
    container.textContent = fullText;
    return; // texto curto, só mostra normal
  }

  const shortText = fullText.slice(0, maxLength) + "...";

  container.textContent = shortText;

  const moreLink = document.createElement("span");
  moreLink.textContent = "Mais";
  moreLink.classList.add("more-link");

  moreLink.onclick = () => {
    const expanded = container.classList.toggle("expanded");
    if (expanded) {
      container.textContent = fullText;
      moreLink.textContent = "Menos";
      container.appendChild(moreLink);
    } else {
      container.textContent = shortText;
      moreLink.textContent = "Mais";
      container.appendChild(moreLink);
    }
  };

  container.appendChild(moreLink);
}

</script>

</body>
</html>
