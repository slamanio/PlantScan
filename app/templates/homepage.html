<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
 
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="shortcut icon" href="/static/assets/imgs/chip.png">
    <link rel="stylesheet" href="/static/css/homepage.css">
  <title>PlantScan</title>
  
</head>
<body>
 
</div>
  <div class="profile-menu-wrapper" id="profileWrapper">
  <img src="{{ profile_image }}" alt="Perfil" id="profilePic">
  <div class="dropdown-menu" id="dropdownMenu">
    <button onclick="handleAction('update')">👤 Perfil</button>
    <button onclick="handleAction('logout')">🚪 Sair</button>
  </div>
</div>


  <div class="main-container">
   
     <div class="chat-container">
      <div class="chat-header">PlantScan 🍃 <button id="toggleHistory" class="floating-btn">≡</button></div>
      <div class="chat-messages" id="chatMessages"></div>
         <div class="input-area">
      <button class="action-btn" onclick="handleAction('scan')">📷 Escanear</button>
    </div>
      </div>
      <input type="file" id="imageInput" accept="image/*" />
    </div>
    

<div class="history-container right-history">
      
  <br>
      <h3>📜 Histórico de Plantas</h3>
      <ul>
        {% for p in plants %}
          <li onclick="handlePlantClick('{{ p.name }}')">
            <span class="plant-icon">🌱</span>
            <strong>{{ p.name }}</strong>
            {%endfor %}
        </ul>
        <br>
      <h4>🏆 Top 3 Plantas</h4>
      <button id="toggleHistoryClose" class="floating-btn-out">≡</button>
      <ul>
        {% for tp in top_plants %}
          <li onclick="handlePlantClick('{{ tp.name }}')"><span class="plant-icon">🔥</span><strong>{{ tp.name }}</strong>
            <span class="count-badge">{{ tp.count }}x</span>
          </li>
        {% endfor %}
      </ul>
      
    </div>
  </div>
  
</body>

  


  <script>


  const profilePic = document.getElementById("profilePic");
  const dropdownMenu = document.getElementById("dropdownMenu");

  profilePic.addEventListener("click", () => {
    dropdownMenu.style.display = dropdownMenu.style.display === "flex" ? "none" : "flex";
  });

  // Fecha se clicar fora
  document.addEventListener("click", (e) => {
    if (!document.getElementById("profileWrapper").contains(e.target)) {
      dropdownMenu.style.display = "none";
    }
  });



    function appendMessage(content, type = 'sent', isImage = false, isHTML = false) {
  const messageElement = document.createElement("div");
  messageElement.className = "message " + type;

  if (isImage) {
    const img = document.createElement("img");
    img.src = content;
    messageElement.appendChild(img);
  } else if (isHTML) {
    messageElement.innerHTML = content;
  } else {
    messageElement.textContent = content;
  }

  document.getElementById("chatMessages").appendChild(messageElement);
  const chatBox = document.getElementById("chatMessages");
  chatBox.scrollTop = chatBox.scrollHeight;
}



document.getElementById("imageInput").addEventListener("change", function () {
  const file = this.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = async function (e) {
    const base64Image = e.target.result;

    appendMessage(base64Image, "sent", true); 

    const formData = new FormData();
    formData.append("file", file);
    appendMessage("Valeu! agora me dê uns segundos para escanear!", "received");
    try {
      const res = await fetch(`${window.location.origin}/analyze`, {
        method: "POST",
        body: formData
      });

      const contentType = res.headers.get("content-type") || "";

      if (contentType.includes("application/json")) {
        const data = await res.json();
        console.log("Resposta JSON recebida:", data);

        const payload = data?.dados || data || {};
        const especie = payload.especie;
        const familia = payload.familia;
        const condicao = payload.condicao_saude;
        const isPlanta = payload.isplant;


        if (isPlanta === false) {
          appendMessage("🚫 Isso não parece ser uma planta ou árvore. Tente outra imagem!", "received");
        } else if (especie && familia && condicao) {
          const respostaHTML = `
            <div style="margin-bottom: 8px;">
              <span style="font-weight:  bold; color: #388e3c; text-align: center;">🌿 Espécie:</span><br>
              <span style="display: inline-block; margin-top: 4px;">${especie}</span>
            </div>
            <div style="margin-bottom: 8px;">
              <span style="font-weight: bold; color: #00695c; text-align: center;">🌳 Família:</span><br>
              <span style="display: inline-block; margin-top: 4px;">${familia}</span>
            </div>
            <div>
              <span style="font-weight: bold; color: #1e88e5; text-align: center;">❤️ Saúde:</span><br>
              <span style="display: inline-block; margin-top: 4px;">${condicao}</span>
            </div>
          `;
          registerPlant(especie, familia, condicao, file);
          appendMessage(respostaHTML, "received", false, true);
        } else {
          appendMessage("⚠️ Resposta incompleta recebida do Gemini.", "received");
        }
          
        
      } else {
        const text = await res.text();
        appendMessage("📩 Resposta inesperada:\n" + text, "received");
      }
    } catch (error) {
      appendMessage("❌ Erro ao analisar a imagem: " + error.message, "received");
    }
  };

  reader.readAsDataURL(file);
  this.value = "";
});


   
    window.onload = () => {
      setTimeout(() => {
        appendMessage("Oi {{user_name}}! Eu sou o Plenty! Precisa de ajuda com algo?", "received");
      }, 500);
    };

 async function registerPlant(nome, especie, descricao, img) {
    const formData = new FormData();
    formData.append("nome", nome);
    formData.append("especie", especie);
    formData.append("descricao", descricao);
    formData.append("image", img);

    const response = await fetch("/rplant", {
        method: "POST",
        body: formData,
    });

    const result = await response.json();
    console.log(result);
}



    function handleAction(action) {
  let message = "";

  switch (action) {

    case "update":
      message = "Quero ver meu perfil!";
      setTimeout(() => {
        appendMessage("Certo {{user_name}}! Redirecionarei você para seu perfil!.", "received");
      }, 500);
        setTimeout(() => {
    window.location.href = "/" + action;
  }, 2000);
      break;

    case "logout":
      message = "Quero sair da minha conta.";
      setTimeout(() => {
        appendMessage("Certo {{user_name}}! Até a próxima!.", "received");
      }, 500);
      setTimeout(() => {
    window.location.href = "/" + action;
  }, 2000);
      break;

    case "scan":
  message = "Quero escanear uma planta ou árvore!";
  setTimeout(() => {
    document.getElementById("imageInput").click(); 
  }, 2000);
  
  
  break;
  }

  appendMessage(message, "sent");
  appendMessage("Certo! me farei o possível para te ajudar a identificar a planta ou árvore!", "received");

  
}

  document.getElementById("toggleHistoryClose").addEventListener("click", () => {
  document.querySelector(".history-container").classList.toggle("open");
});
  document.getElementById("toggleHistory").addEventListener("click", () => {
  document.querySelector(".history-container").classList.toggle("open");
});


  function handlePlantClick(plantName) {
    appendMessage(`Quero saber mais sobre a planta: ${plantName}`, "sent");

    const formData = new FormData();
    formData.append("nome", plantName);

    fetch("/planta-info", {
      method: "POST",
      body: formData
    })
    .then(response => {
      if (!response.ok) throw new Error("Erro ao buscar planta");
      return response.json();
    })
    .then(data => {
      const { especie, familia, descricao, image } = data;
      const imagens = image; 
      let currentIndex = 0;
      const uniqueId = "carousel_" + Math.random().toString(36).substring(2, 9);

  const respostaHTML = `
  <div style="margin-bottom: 8px;">
    <span style="font-weight: bold; color: #388e3c;">🌿 Espécie:</span><br>
    <span>${especie}</span>
  </div>
  <div style="margin-bottom: 8px;">
    <span style="font-weight: bold; color: #00695c;">🌳 Família:</span><br>
    <span>${familia}</span>
  </div>
  <div style="margin-bottom: 8px;">
    <span style="font-weight: bold; color: #1e88e5;">❤️ Saúde:</span><br>
    <span>${descricao}</span>
  </div>

  <div style="text-align:center; margin-bottom: 12px;">
    <span style="font-weight: bold; color: #1e88e5;">📷 Imagens:</span><br>
    <div id="${uniqueId}" style="position: relative; max-width: 100%; width: 300px; margin: auto; overflow: hidden; border-radius: 10px;">
      <img id="${uniqueId}_image" src="${imagens[0]}" 
           style="width: 100%; border-radius:10px; transition: opacity 0.5s ease-in-out;">
      <button id="${uniqueId}_prev" 
        style="position:absolute; left:5px; top:50%; transform:translateY(-50%);
        background:rgba(0,0,0,0.5); color:#fff; border:none; border-radius:50%;
        width:40px; height:40px; font-size:20px; cursor:pointer; z-index:10;">❮</button>
      <button id="${uniqueId}_next" 
        style="position:absolute; right:5px; top:50%; transform:translateY(-50%);
        background:rgba(0,0,0,0.5); color:#fff; border:none; border-radius:50%;
        width:40px; height:40px; font-size:20px; cursor:pointer; z-index:10;">❯</button>
    </div>
  </div>
  `;

  appendMessage(respostaHTML, "received", false, true);

  // ✅ Lógica do carrossel (sem dots)
  setTimeout(() => {
    const imgElement = document.getElementById(`${uniqueId}_image`);
    const prevBtn = document.getElementById(`${uniqueId}_prev`);
    const nextBtn = document.getElementById(`${uniqueId}_next`);

    function showImage(index) {
      currentIndex = index;
      imgElement.style.opacity = 0;
      setTimeout(() => {
        imgElement.src = imagens[currentIndex];
        imgElement.style.opacity = 1;
      }, 200);
    }

    prevBtn.addEventListener("click", () => {
      currentIndex = (currentIndex - 1 + imagens.length) % imagens.length;
      showImage(currentIndex);
    });

    nextBtn.addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % imagens.length;
      showImage(currentIndex);
    });

  }, 50);
})
  }
  </script>
</body>
</html>
