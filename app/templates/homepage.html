<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat Expandido com Imagem</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f1f1f1;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 90%;
      max-width: 700px;
      height: 90vh;
      background: white;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 15px 20px;
      background: #4CAF50;
      color: white;
      font-weight: bold;
      font-size: 1.2em;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #fafafa;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 2px solid;
      word-wrap: break-word;
    }

    .sent {
      align-self: flex-end;
      background: #e1ffc7;
      border-color: #4CAF50;
    }

    .received {
      align-self: flex-start;
      background: #f0f0f0;
      border-color: #999;
      position: relative;
      padding-top: 20px;
    }

    .received::before {
      content: "Planty";
      position: absolute;
      top: 2px;
      left: 10px;
      font-size: 0.7em;
      color: #555;
    }

    .message img {
      max-width: 100%;
      border-radius: 8px;
    }

    .input-area {
      padding: 15px 20px;
      display: flex;
      align-items: center;
      background: #fff;
      border-top: 1px solid #ddd;
    }

    .file-label {
      flex: 1;
      text-align: center;
      padding: 12px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.3s;
      font-size: 1em;
    }

    .file-label:hover {
      background: #45a049;
    }

    #imageInput {
      display: none;
    }

    @media (max-width: 600px) {
      .chat-container {
        height: 100vh;
        width: 100%;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">PlantScan 🍃 </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="input-area">
      <label class="file-label" for="imageInput">📷 Escolher imagem</label>
      <input type="file" id="imageInput" accept="image/*" />
    </div>
  </div>

  <script>
    function appendMessage(content, type = 'sent', isImage = false) {
      const messageElement = document.createElement("div");
      messageElement.className = "message " + type;

      if (isImage) {
        const img = document.createElement("img");
        img.src = content;
        messageElement.appendChild(img);
      } else {
        messageElement.textContent = content;
      }

      document.getElementById("chatMessages").appendChild(messageElement);

      const chatBox = document.getElementById("chatMessages");
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    document.getElementById("imageInput").addEventListener("change", function () {
      const file = this.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        appendMessage(e.target.result, "sent", true);
      };
      reader.readAsDataURL(file);

      this.value = ""; // permite reenvio da mesma imagem
    });

    // Mensagem automática da "outra pessoa"
    window.onload = () => {
      setTimeout(() => {
        appendMessage("Oi {{user_name}}! Precisa de ajuda com algo? Pode enviar uma imagem se quiser.", "received");
      }, 500);
    };
  </script>
</body>
</html>
