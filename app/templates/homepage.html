<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="shortcut icon" href="/static/assets/imgs/chip.png">
  <title>PlantScan</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f1f1f1;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 90%;
      max-width: 700px;
      height: 90vh;
      background: white;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 15px 20px;
      background: #4CAF50;
      color: white;
      font-weight: bold;
      font-size: 1.2em;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #fafafa;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 2px solid;
      word-wrap: break-word;
    }

    .sent {
      content: "Planty";
      align-self: flex-end;
      background: #e1ffc7;
      border-color: #4CAF50;
    }

    .received {
      align-self: flex-start;
      background: #f0f0f0;
      border-color: #999;
      position: relative;
      padding-top: 20px;
    }

    .received::before {
      content: "Planty";
      position: absolute;
      top: 2px;
      left: 10px;
      font-size: 0.7em;
      color: #555;
    }

    .message img {
      max-width: 100%;
      border-radius: 8px;
    }

    .input-area {
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
  background: #fff;
  border-top: 1px solid #ddd;
}

.action-btn {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 20px;
  background-color: #4CAF50;
  color: white;
  font-size: 1em;
  cursor: pointer;
  transition: background 0.3s;
}

.action-btn:hover {
  background-color: #45a049;
}


    

    .file-label:hover {
      background: #45a049;
    }

    #imageInput {
      display: none;
    }

    @media (max-width: 600px) {
      .chat-container {
        height: 100vh;
        width: 100%;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">PlantScan 🍃 </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="input-area">
      <button class="action-btn" onclick="handleAction('update')">👤 Perfil</button>
  <button class="action-btn" onclick="handleAction('logout')">🚪 Sair</button>
  <button class="action-btn" onclick="handleAction('scan')">📷 Escanear</button>
  
</div>

      <input type="file" id="imageInput" accept="image/*" />
    </div>
  </div>

  <script>
    function appendMessage(content, type = 'sent', isImage = false) {
      const messageElement = document.createElement("div");
      messageElement.className = "message " + type;

      if (isImage) {
        const img = document.createElement("img");
        img.src = content;
        messageElement.appendChild(img);
      } else {
        messageElement.textContent = content;
      }

      document.getElementById("chatMessages").appendChild(messageElement);

      const chatBox = document.getElementById("chatMessages");
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    document.getElementById("imageInput").addEventListener("change", function () {
  const file = this.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = async function (e) {
    const base64Image = e.target.result;

    appendMessage(base64Image, "sent", true); 

    const formData = new FormData();
    formData.append("file", file);

    try {
  const res = await fetch(`${window.location.origin}/analyze`, {
    method: "POST",
    body: formData
  });

  const contentType = res.headers.get("content-type") || "";

  if (contentType.includes("application/json")) {
    const data = await res.json();
    console.log("Resposta JSON recebida:", data);
    const description = data?.description || "🌧️ Erro ao analisar a imagem. Tente de novo!";
appendMessage(description, "received");
  } else {
    const text = await res.text();
    appendMessage("Plenty recebeu uma resposta inesperada:\n" + text, "received");
  }
} catch (error) {
  appendMessage("Oops! Erro ao analisar a imagem: " + error.message, "received");
}
  };

  reader.readAsDataURL(file);
  this.value = "";
});

   
    window.onload = () => {
      setTimeout(() => {
        appendMessage("Oi {{user_name}}! Eu sou o Plenty! Precisa de ajuda com algo?", "received");
      }, 500);
    };

    function handleAction(action) {
  let message = "";

  switch (action) {
    case "update":
      message = "Quero ver meu perfil!";
      setTimeout(() => {
        appendMessage("Certo {{user_name}}! Redirecionarei você para seu perfil!.", "received");
      }, 500);
        setTimeout(() => {
    window.location.href = "/" + action;
  }, 2000);
      break;
    case "logout":
      message = "Quero sair da minha conta.";
      setTimeout(() => {
        appendMessage("Certo {{user_name}}! Até a próxima!.", "received");
      }, 500);
      setTimeout(() => {
    window.location.href = "/" + action;
  }, 2000);
      break;
    case "scan":
  message = "Quero escanear uma planta!";
  document.getElementById("imageInput").click(); 
  break;
  }

  appendMessage(message, "sent");

  
}

  </script>
</body>
</html>
