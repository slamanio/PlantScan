<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="shortcut icon" href="/static/assets/imgs/chip.png">
    <title>PlantScan</title>
    <style>
.delete-btn {
  margin-top: 20px;
  width: 100%;
  padding: 12px;
  background-color: #e53935;
  color: white;
  border: none;
  border-radius: 25px;
  font-size: 1em;
  cursor: pointer;
  transition: background 0.3s ease;
  font-weight: bold;
}

.delete-btn:hover {
  background-color: #c62828;
}
.modal {
  display: none;
  position: fixed;
  z-index: 9999;
  left: 0; top: 0;
  width: 100%; height: 100%;
  background-color: rgba(0,0,0,0.5);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: white;
  padding: 30px;
  border-radius: 10px;
  width: 90%;
  max-width: 400px;
  text-align: center;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.modal-content h3 {
  margin-bottom: 15px;
}

.modal-content input {
  padding: 10px;
  width: 80%;
  margin: 10px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.modal-actions {
  display: flex;
  justify-content: space-around;
  margin-top: 15px;
}

.modal-actions button {
  padding: 10px 20px;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  font-weight: bold;
}

.modal-actions button:first-child {
  background-color: #e53935;
  color: white;
}

.modal-actions button:last-child {
  background-color: #ccc;
  color: #333;
}
/* Contêiner da foto de perfil */
.profile-pic-wrapper {
  position: relative;
  display: inline-block;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  overflow: hidden;
}

/* Imagem redonda */
.profile-pic-wrapper img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border: 2px solid #388e3c;
  border-radius: 50%;
  transition: transform 0.3s ease;
}

/* Overlay do X */
.profile-pic-wrapper::after {
  content: "✖";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  font-size: 32px;
  color: #fff;
  opacity: 0;
  background: rgba(229, 57, 53, 0.6);
  width: 100%;
  height: 100%;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: transform 0.3s ease, opacity 0.3s ease;
}

/* Hover: Zoom leve e X aparece */
.profile-pic-wrapper:hover img {
  transform: scale(1.1);
}
.profile-pic-wrapper:hover::after {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}


</style>

</head>
<body>    
    <div class="contreg">
    <div class="board">
        <button class="back-btn" onclick="window.location.href='{{ url_for('home') }}'">
            <i class="fas fa-arrow-left"></i>
        </button>

        <div class="form-container">
            <h2 class="form-title">Informações</h2>

            {% if mensagem %}
            <p style="color: red;">{{ mensagem | safe }}</p>
            {% endif %}

            <form method="post" enctype="multipart/form-data" name="update">
                <div style="text-align:center; margin-bottom:15px;">
                  <div class="profile-pic-wrapper">
    <img id="preview-pic" src="{{ user_profile_image }}">
</div>
<br>
<label for="profile-pic" style="cursor:pointer;">
    <i class="fas fa-camera" style="font-size:32px; color:#388e3c;"></i>
</label>
<input type="file" id="profile-pic" name="profile_image" accept="image/*" style="display:none;">

             
                </div>

                <div class="input-group">
                    <input type="text" id="full_name" name="full_name" placeholder=" ">
                    <label for="full_name">{{ user_name }}</label>
                </div>

                <div class="input-group">
                    <input type="email" id="email" name="email" placeholder=" ">
                    <label for="email">{{ user_email }}</label>
                </div>

                <button type="submit" class="submit-btn">Atualizar</button>
                <!-- Botão Deletar Conta -->


            </form>
            
  <button type="button" class="delete-btn" onclick="openDeleteModal()">🗑️ Deletar Conta</button>

<!-- Modal -->
<div id="deleteModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center;">
  <div style="background:#fff; padding:20px; border-radius:10px; width:300px; text-align:center;">
    <h3>Confirmar Exclusão</h3>
    <p>Digite sua senha para confirmar:</p>

    <form method="post" name="delete" action="/delete">
      <input type="password" id="senha" name="senha" required style="padding:8px; width: 250px; margin-top:8px; border-radius:5px; border: 1px solid #ccc;"/>
      <div class="modal-actions" style="margin-top:10px;">
        <button type="submit" class="confirm-btn">Confirmar</button>
        <button type="button" onclick="closeDeleteModal()">Cancelar</button>
      </div>
    </form>
  </div>
</div>
    <script>
      

        document.getElementById("profile-pic").addEventListener("change", function(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById("preview-pic").src = e.target.result;
        }
        reader.readAsDataURL(file);
    }
});
      document.querySelector(".profile-pic-wrapper").addEventListener("click", function () {
    const img = this.querySelector("img");
    const defaultImg = "/profpic/default.png";

    // Se já está no default, não faz nada
    if (img.src.includes("default.png")) return;

    // Anima fade-out
    img.style.transition = "opacity 0.3s ease";
    img.style.opacity = "0";

    setTimeout(() => {
        img.src = `${defaultImg}?t=${Date.now()}`;
        img.style.opacity = "1";
    }, 300);

});


        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.toggle-password').forEach(icon => {
                icon.addEventListener('click', function() {
                    const input = this.parentElement.querySelector('input');
                    if (input.type === 'password') {
                        input.type = 'text';
                        this.classList.remove('fa-eye');
                        this.classList.add('fa-eye-slash');
                    } else {
                        input.type = 'password';
                        this.classList.remove('fa-eye-slash');
                        this.classList.add('fa-eye');
                    }
                });
            });
        });


function openDeleteModal() {
  document.getElementById('senha').value = '';
  document.getElementById('deleteModal').style.display = 'flex';
}

function closeDeleteModal() {
  document.getElementById('deleteModal').style.display = 'none';
}
function confirmpass(event) {
  const senha = document.getElementById("senha").value.trim();

  // Bloqueia se o campo estiver vazio
  if (!senha) {
    alert("Por favor, digite sua senha.");
    event.preventDefault();
    return false;
  }

  // Pergunta confirmação ao usuário
  const confirmar = confirm("Tem certeza que deseja deletar sua conta?");
  if (!confirmar) {
    event.preventDefault();
    return false;
  }

  // ✅ Se tudo estiver OK, permite o envio
  return true;

}




    </script>
</body>
</html>
